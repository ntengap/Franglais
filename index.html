<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Franglais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: single phone-width column, five tabs (Home, Lesson, Franglais, Mission, History) */
:root{
  --bg:#eaf2fd; --card:#ffffff; --ink:#11264b; --muted:#5a6d8e; --line:#d6e2f5;
  --blue:#1d5fe0; --blue-ink:#ffffff; --blue-soft:#e2ecff;
  --sun:#f3ac22; --sun-soft:#fff3d6; --night:#243a7a; --night-soft:#dfe5fa;
  --good:#17895a; --good-soft:#dcf4e8; --shadow:0 6px 20px rgba(29,95,224,.10);
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1325; --card:#16213d; --ink:#e9f0ff; --muted:#9db0d6; --line:#2a3a64;
  --blue:#5b8dff; --blue-ink:#071230; --blue-soft:#1d2d5a;
  --sun:#f6bb4a; --sun-soft:#3b3115; --night:#9db4ff; --night-soft:#222f5e;
  --good:#4fd39b; --good-soft:#143a2e; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1325; --card:#16213d; --ink:#e9f0ff; --muted:#9db0d6; --line:#2a3a64;
  --blue:#5b8dff; --blue-ink:#071230; --blue-soft:#1d2d5a;
  --sun:#f6bb4a; --sun-soft:#3b3115; --night:#9db4ff; --night-soft:#222f5e;
  --good:#4fd39b; --good-soft:#143a2e; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.logo{font-family:var(--display);font-weight:700;font-size:2rem;color:var(--blue);letter-spacing:-.5px}
.tag{color:var(--muted);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:1rem;width:100%}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.small{padding:10px 14px;width:auto;font-size:.9rem}
.big{font-family:var(--display);font-weight:600;font-size:2.6rem;line-height:1}
.pron{font-weight:800;color:var(--blue)}
.hide{display:none!important}

/* hero */
.hero{border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.hero.day{background:var(--sun-soft)} .hero.night{background:var(--night-soft)}
.hero svg{flex:none}
.hero .word{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
.hero .ctx{margin-top:6px;font-size:.95rem;color:var(--muted)}
.num{font-family:var(--display);font-weight:600;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{color:var(--muted);font-size:.85rem;font-weight:700}

/* pair switch */
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid transparent;border-radius:14px;padding:12px;font-family:var(--display);font-weight:600;font-size:1.2rem;display:flex;gap:8px;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--card)}
.play{display:flex;gap:12px;align-items:center;width:100%;background:var(--blue-soft);border:0;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink);text-align:left}
.play .dot{width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
ul.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.ex li b{display:block}
ul.ex li span{color:var(--muted);font-size:.9rem}

/* scene */
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choices button{flex:1;min-width:120px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-family:var(--display);font-weight:600;font-size:1.2rem}
.say-bubble{background:var(--blue-soft);border-radius:16px;padding:12px 14px;font-weight:700}
.reply{border-radius:14px;padding:12px 14px;background:var(--good-soft);color:var(--ink);font-weight:700}
.reply.soft{background:var(--sun-soft)}

/* franglais */
.bar{height:12px;background:var(--blue-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.sentence{font-size:1.35rem;font-weight:700;line-height:1.6}
.sentence+.sentence{color:var(--muted);margin-top:4px}
.fr{font:inherit;font-weight:800;color:var(--blue);background:var(--blue-soft);border:0;border-radius:8px;padding:0 6px;cursor:pointer}
.fr:hover{filter:brightness(.97)}
.levels{display:flex;gap:6px;justify-content:space-between;font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}

/* mission */
.ring{width:210px;height:210px;margin:6px auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:3rem;font-variant-numeric:tabular-nums}
.ring circle{fill:none;stroke-width:12}
.plus{background:var(--blue);color:var(--blue-ink);border:0;border-radius:18px;padding:18px;font-family:var(--display);font-weight:600;font-size:1.5rem;width:100%}
.plus:active{transform:scale(.98)}
.center{text-align:center}

/* history */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:0;border-radius:99px;padding:8px 14px;background:var(--card);font-weight:800;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.hist{display:flex;flex-direction:column}
.hist .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist .it:last-child{border-bottom:0}
.hist .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.hist .ic.d{background:var(--sun-soft)} .hist .ic.n{background:var(--night-soft)} .hist .ic.o{background:var(--blue-soft)}
.pairs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pairs button{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--card);font-weight:800;color:var(--muted);white-space:nowrap}
.pairs button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;text-align:left}
.opts button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.gr{display:block;width:100%;text-align:left;background:var(--blue-soft);border:0;border-radius:14px;padding:12px 14px;font-size:1.1rem;font-weight:700}
.gr small{display:block;color:var(--muted);font-weight:600;font-size:.85rem;margin-top:2px}
.gr .aux{background:var(--blue);color:var(--blue-ink);border-radius:6px;padding:0 6px}
.gr .pp{text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:3px;text-underline-offset:3px}
.hist .nm{flex:1;min-width:0;font-weight:800}
.hist .nm small{display:block;color:var(--muted);font-weight:600}
.hist .p{color:var(--good);font-weight:800}
.badge{font-size:.7rem;background:var(--sun-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:800;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(29,95,224,.08)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;color:var(--muted);font-size:.72rem;font-weight:800;border-radius:12px;flex:1}
.tabs button[aria-current="page"]{color:var(--blue)}
.demo{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:20px;flex-wrap:wrap}
.demo select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.journey{display:flex;justify-content:space-between;gap:6px}
.jn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.jd{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--blue-ink)}
.jn.done .jd{background:var(--good);border-color:var(--good)}
.jn.now .jd{border-color:var(--blue);background:var(--blue-soft)}
.jl{font-size:.7rem;font-weight:800;color:var(--muted);line-height:1.2}
.jn.now .jl{color:var(--blue)}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.crit .bar{grid-column:1/-1;height:8px}
.pill{font-size:.72rem;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--blue-soft);color:var(--blue)}
.pill.s-ACTIVE,.pill.s-MASTERED{background:var(--good-soft);color:var(--good)}
.pill.s-NEEDS_REACTIVATION{background:var(--sun-soft);color:var(--ink)}
.pill.s-NEW{background:var(--line);color:var(--muted)}
.tabs button{font-size:.66rem;padding-inline:2px}
.inp{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.sdots{display:flex;gap:6px}
.sdots i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.sdots i.d{background:var(--good)} .sdots i.n{background:var(--blue)}
.who{font-weight:800;color:var(--blue);font-size:.9rem}
.choices button.ok{border-color:var(--good);background:var(--good-soft)}
.choices button.bad{border-color:var(--sun);background:var(--sun-soft)}
.choices button:disabled{cursor:default;color:var(--ink)}
.choices button{font-size:1.05rem;text-align:left}
</style>

<div class="app" id="app">
  <section id="s-home" class="stack"></section>
  <section id="s-lesson" class="stack hide"></section>
  <section id="s-fran" class="stack hide"></section>
  <section id="s-life" class="stack hide"></section>
  <section id="s-gram" class="stack hide"></section>
  <section id="s-prog" class="stack hide"></section>
  <section id="s-ctx" class="stack hide"></section>
  <section id="s-set" class="stack hide"></section>
  <section id="s-mission" class="stack hide"></section>
  <section id="s-result" class="stack hide"></section>
  <section id="s-history" class="stack hide"></section>

  <div class="demo">
    <label for="demoTime">Demo clock</label>
    <select id="demoTime">
      <option value="">Real time</option>
      <option value="09:00">09:00 morning</option>
      <option value="16:45">16:45 late afternoon</option>
      <option value="18:30">18:30 evening</option>
      <option value="02:00">02:00 night</option>
    </select>
  </div>
</div>

<nav class="tabs" aria-label="Main">
  <button data-go="home"></button>
  <button data-go="lesson"></button>
  <button data-go="life"></button>
  <button data-go="mission"></button>
  <button data-go="history"></button>
  <button data-go="prog"></button>
</nav>

  CONTENT.veux=ex('Je veux','zhuh vuh','I want','yes','French people say Oui first, then Je veux. To keep it short, just say Oui, merci. For a softer, polite request, Je voudrais comes later.',[['Oui, je veux un café.','Yes, I want a coffee.'],['Oui, merci.','Yes, thanks.']]);

    $('#s-prog').innerHTML=
      '<div class="top"><div><div class="eyebrow">Your level</div><h1 style="font-size:1.7rem">'+STAGES[st]+'</h1></div></div>'+
      '<div class="card stack">'+journey+'</div>'+
      stageCard+
      '<div class="card stack"><div class="eyebrow">Toward Français en action</div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div><p class="tag">'+pct+'% of the starting criteria. These numbers are starting values to test, not fixed rules.</p>'+crit+
        (hasSample?'<p class="tag">Includes example uses until you clear them in History.</p>':'')+'</div>'+
      '<div class="card"><div class="eyebrow" style="margin-bottom:6px">Your expressions</div><div class="hist">'+exprs+'</div></div>'+
      '<div class="row"><button class="btn ghost" data-stage="1">Preview next stage (demo)</button><button class="btn ghost" data-go="set">Settings</button></div>';
  }

  function mk(o){var a=o.pre,b=o.pre2||o.pre;return {fr:o.fr,pron:o.pron,en:o.en,kind:o.kind,when:o.when,examples:o.examples,
    sentence:[a[0],a[1],a[2],a[2],a[3],a[3]],reply:o.reply,listen:o.listen}}
  CONTENT.aurevoir=mk({fr:'Au revoir',pron:'oh ruh-VWAHR',en:'Goodbye',kind:'smile',when:'Au revoir when you leave and may not see the person again soon.',
    examples:[['Au revoir, madame !','Goodbye, madam!'],['Au revoir et merci !','Goodbye and thank you!']],
    pre:['You leave the shop.','You leave the shop.','You [[quittez le magasin]].','Vous quittez le magasin.'],
    reply:['— Goodbye!','— [[Au revoir]] !','— [[Au revoir]] !','— [[Au revoir]] !','— [[Au revoir]] !','— [[Au revoir]], [[bonne journée]] !'],listen:'Au revoir, bonne journée !'});
  CONTENT.abientot=mk({fr:'À bientôt',pron:'ah byan-TOH',en:'See you soon',kind:'heart',when:'À bientôt when you expect to see the person again soon.',
    examples:[['À bientôt !','See you soon!'],['Merci, à bientôt !','Thanks, see you soon!']],
    pre:['You will be back tomorrow.','You will be back tomorrow.','You [[reviens demain]].','Tu reviens demain.'],
    reply:['— See you soon!','— [[À bientôt]] !','— [[À bientôt]] !','— [[À bientôt]] !','— [[À bientôt]] !','— [[À bientôt]], [[à demain]] !'],listen:'À bientôt, à demain !'});
  CONTENT.jour=mk({fr:'Jour',pron:'zhoor',en:'Day',kind:'d',when:'Jour is the daytime. Bonjour literally means "good day".',
    examples:[['Un bon jour.','A good day.'],['Tous les jours.','Every day.']],
    pre:['The sun is up. It is daytime.','The sun is up. It is [[le jour]].','Le soleil est levé. [[C\'est le jour]].',"Le soleil est levé. C'est le jour."],
    reply:['— A good day!','— A good [[jour]] !','— Un bon [[jour]] !','— Un bon [[jour]] !','— Un bon [[jour]] !','— Un bon [[jour]] ! [[Bonjour]] !'],listen:'Un bon jour ! Bonjour !'});
  CONTENT.nuit=mk({fr:'Nuit',pron:'nwee',en:'Night',kind:'n',when:'Nuit is the night. Bonne nuit says good night before sleep.',
    examples:[['Bonne nuit !','Good night!'],['Cette nuit, je dors bien.','Tonight, I sleep well.']],
    pre:['It is dark. It is nighttime.','It is dark. It is [[la nuit]].','Il fait noir. [[C\'est la nuit]].',"Il fait noir. C'est la nuit."],
    reply:['— Good night!','— Good [[nuit]] !','— [[Bonne nuit]] !','— [[Bonne nuit]] !','— [[Bonne nuit]] !','— [[Bonne nuit]] ! [[Dors bien]] !'],listen:'Bonne nuit ! Dors bien !'});
  PAIRS.push({id:'bye',a:'aurevoir',b:'abientot',title:'Au revoir / À bientôt',sub:'Goodbye / See you soon'});
  PAIRS.push({id:'daynight',a:'jour',b:'nuit',title:'Jour / Nuit',sub:'Day / Night'});
  var SET=load('fr_set',{rate:0.85,name:''}),resetAsk=false;
  function rSet(){
    $('#s-set').innerHTML=
      '<div class="top"><div><div class="eyebrow">Profile</div><h1 style="font-size:1.7rem">Settings</h1></div></div>'+
      '<div class="card stack"><label class="eyebrow" for="setName">Your name</label><input id="setName" class="inp" value="'+SET.name.replace(/"/g,'')+'" maxlength="24" placeholder="Optional">'+
      '<label class="eyebrow" for="setRate">French voice speed</label><select id="setRate" class="inp"><option value="0.7">Slow</option><option value="0.85">Normal</option><option value="1">Fast</option></select>'+
      '<button class="btn ghost" data-say="Bonjour, comment ça va ?">Test the voice</button></div>'+
      '<div class="card stack"><div class="eyebrow">Your data</div><p class="tag">Stored only in this browser.</p>'+
      (resetAsk?'<p><b>Erase all uses and progress?</b></p><div class="row"><button class="btn ghost" data-reset="no">Keep</button><button class="btn" data-reset="yes">Erase</button></div>':'<button class="btn ghost" data-reset="ask">Reset everything</button>')+'</div>';
    $('#setRate').value=String(SET.rate);
  }

  var FILTERS=[['all','All'],['today','Today'],['7','7 days'],['30','30 days']];
  function when(ts){
    var d=new Date(ts),n=new Date(),mid=new Date();mid.setHours(0,0,0,0);
    var t=pad(d.getHours())+':'+pad(d.getMinutes());
    if(ts>=mid.getTime())return 'Today, '+t;
    if(ts>=mid.getTime()-864e5)return 'Yesterday, '+t;
    return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+', '+t;
  }
  function rHistory(){
    var mid=new Date();mid.setHours(0,0,0,0);var lim={all:0,today:mid.getTime(),'7':Date.now()-7*864e5,'30':Date.now()-30*864e5}[histFilter];
    var list=events.filter(function(e){return e.ts>=lim}).sort(function(a,b){return b.ts-a.ts});
    var hasSample=events.some(function(e){return e.sample});
    var per={};events.forEach(function(e){per[e.expr]=Math.max(per[e.expr]||0,e.ts)});
    var revive=Object.keys(per).filter(function(k){return per[k]<Date.now()-864e5});
    var sum={};list.forEach(function(e){var o=sum[e.expr]||(sum[e.expr]={n:0,last:0});o.n++;o.last=Math.max(o.last,e.ts)});
    var rows=Object.keys(sum).sort(function(a,b){return sum[b].n-sum[a].n});
    var ic=function(c){return '<div class="ic '+(c.kind==='d'||c.kind==='n'?c.kind:'o')+'">'+ico(c.kind,24)+'</div>'};
    var shown=histAll?list:list.slice(0,5);
    $('#s-history').innerHTML=
      '<div class="top"><div><div class="eyebrow">Real uses</div><h1 style="font-size:1.7rem">History</h1></div><div class="num">'+list.length+'</div></div>'+
      '<div class="chips">'+FILTERS.map(function(f){return '<button data-f="'+f[0]+'" aria-pressed="'+(histFilter===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>'+
      (revive.length?'<div class="reply soft">To bring back: '+revive.map(function(k){return CONTENT[k].fr}).join(', ')+'.</div>':'')+
      (rows.length?'<div class="card"><div class="hist">'+rows.map(function(k){var c=CONTENT[k];
        return '<div class="it">'+ic(c)+'<div class="nm">'+c.fr+'<small>last '+when(sum[k].last)+'</small></div><div class="p">×'+sum[k].n+'</div></div>'}).join('')+'</div></div>':
        '<div class="card"><p class="tag">No real uses in this period yet. Start a mission and tap +1 when you say it.</p></div>')+
      (list.length>5?'<button class="btn ghost" data-all="1">'+(histAll?'Show latest 5 only':'Show all '+list.length+' uses')+'</button>':'')+
      (histAll&&list.length?'<div class="card"><div class="hist">'+shown.map(function(e){var c=CONTENT[e.expr];
        return '<div class="it">'+ic(c)+'<div class="nm">'+c.fr+(e.sample?'<span class="badge">example</span>':'')+'<small>'+when(e.ts)+'</small></div><div class="p">+1</div></div>'}).join('')+'</div></div>':'')+
      (hasSample?'<button class="btn ghost" data-clear="1">Clear example uses</button>':'');
  }

  /* ---------- navigation ---------- */
  var TAB_LABELS={home:'Home',lesson:'Learn',life:'My life',mission:'Mission',history:'History',prog:'Progress'};var TAB_OF={ctx:'home',set:'prog',fran:'lesson',gram:'life',result:'mission'};
  function renderTabs(){
    document.querySelectorAll('.tabs button').forEach(function(b){var k=b.dataset.go;
      b.innerHTML=svg(k,24)+'<span>'+TAB_LABELS[k]+'</span>';
      if(k===cur||TAB_OF[cur]===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  }
  var R={home:rHome,lesson:rLesson,fran:rFran,life:rLife,gram:rGram,prog:rProg,set:rSet,ctx:rCtx,mission:rMission,result:rResult,history:rHistory};
  var SEC={home:'s-home',lesson:'s-lesson',fran:'s-fran',life:'s-life',gram:'s-gram',prog:'s-prog',set:'s-set',ctx:'s-ctx',mission:'s-mission',result:'s-result',history:'s-history'};
  function go(k){
    cur=k;Object.keys(SEC).forEach(function(x){$('#'+SEC[x]).classList.toggle('hide',x!==k)});
    R[k]();renderTabs();window.scrollTo(0,0);
  }

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;var d=t.dataset;
    if(d.say){say(d.say);return}
    if(d.go){go(d.go);return}
    if(d.open){famView=false;lessonExpr=d.open;sceneAnswer=null;level=0;go('lesson');return}
    if(d.sp){if(story.pick===null){story.pick=+d.sp;if(story.pick===0)story.score++;var sf=storyFor(story.key.replace(/(morning|evening|bonjour|bonsoir)$/,'').replace(/^greet.*/,'greet'));var so=sf.steps[story.step].opts[story.pick][0];say(so)}R.lesson();return}
    if(d.sn){story.step++;story.pick=null;R.lesson();return}
    if(d.sr){story={key:story.key,step:0,pick:null,score:0};R.lesson();return}
    if(d.fr){lessonExpr=d.fr;level=0;go('fran');return}
    if(d.pair){famView=(d.pair==='family');lessonExpr=PAIRS.filter(function(x){return x.id===d.pair})[0].a;sceneAnswer=null;level=0;R.lesson();return}
    if(d.day){lifeDay=d.day;lifePick=null;lifeStep=0;R.life();return}
    if(d.lp){lifePick=+d.lp;lifeStep=0;var ls=lifeSeen();ls[lifeDay]=(ls[lifeDay]||0)+1;save('fr_life',ls);R.life();return}
    if(d.lstep){lifeStep=Math.max(0,Math.min(lifeSegs().length,lifeStep+(+d.lstep)));R.life();return}
    if(d.reset){if(d.reset==='ask')resetAsk=true;else if(d.reset==='no')resetAsk=false;else{events=[];save('fr_events',events);save('fr_life',{hier:0,aujourdhui:0,demain:0});demoStage=0;resetAsk=false}R.set();return}
    if(d.wx){ctxWx=d.wx;ctxLevel=0;R.ctx();return}
    if(d.cl){ctxLevel=Math.max(0,Math.min(99,ctxLevel+(+d.cl)));R.ctx();return}
    if(d.stage){demoStage=demoStage===0?2:demoStage===2?3:0;R.prog();return}
    if(d.en){autoEn=!autoEn;R.prog();return}
    if(d.gt){gramTopic=d.gt;gramMore=false;R.gram();return}
    if(d.pat){gramTopic=d.pat;gramMore=false;go('gram');return}
    if(d.more){gramMore=!gramMore;R.gram();return}
    if(d.start){startMission(d.start);return}
    if(d.lvl){level=Math.max(0,Math.min(franSegs(franId()).length,level+(+d.lvl)));R.fran();return}
    if(d.plus){mission.uses++;addUse(mission.expr,'mission');var mu=$('#mu');if(mu)mu.textContent=mission.uses;return}
    if(d.pause){mission.running=!mission.running;if(mission.running&&!mission.timer)mission.timer=setInterval(tick,1000);R.mission();return}
    if(d.finish){finishMission();return}
    if(d.f){histFilter=d.f;R.history();return}
    if(d.all){histAll=!histAll;R.history();return}
    if(d.clear){events=events.filter(function(e){return !e.sample});save('fr_events',events);R.history();return}
  });
  document.addEventListener('input',function(e){if(e.target.id==='setName'){SET.name=e.target.value;save('fr_set',SET)}});
  document.addEventListener('change',function(e){if(e.target.id==='setRate'){SET.rate=+e.target.value;save('fr_set',SET)}});
  $('#demoTime').addEventListener('change',function(e){demoTime=e.target.value;sceneAnswer=null;lessonExpr=null;go(cur==='result'?'home':cur)});
  try{window.speechSynthesis&&window.speechSynthesis.getVoices()}catch(e){}
  go('home');
})();
</script>

</body></html>
